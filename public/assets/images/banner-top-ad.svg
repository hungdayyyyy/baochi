<svg width="970" height="250" viewBox="0 0 970 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141110" />
      <stop offset="50%" stop-color="#1c1614" />
      <stop offset="100%" stop-color="#0e0c0b" />
    </linearGradient>
    <linearGradient id="glowRed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f4121e" />
      <stop offset="100%" stop-color="#ff6b4a" />
    </linearGradient>
    <linearGradient id="ribbonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb300" stop-opacity="0.9" />
      <stop offset="35%" stop-color="#ff3d00" stop-opacity="0.8" />
      <stop offset="70%" stop-color="#0091ea" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0.9" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="970" height="250" fill="url(#bgGrad)" />

  <!-- Subtle glow shapes on the right -->
  <g opacity="0.85">
    <path d="M 620,10 C 680,80 720,140 780,240 C 850,220 910,130 940,30 C 880,90 820,160 750,180 C 690,140 660,60 620,10 Z" fill="url(#ribbonGrad)" opacity="0.35" />
    <path d="M 670,0 C 730,90 770,160 840,250 C 900,210 930,120 960,10 C 900,100 840,170 780,190 C 720,130 690,50 670,0 Z" stroke="url(#ribbonGrad)" stroke-width="3" fill="none" opacity="0.8" />
    <path d="M 640,30 C 700,100 750,180 810,245" stroke="#ff3d00" stroke-width="2.5" fill="none" opacity="0.7" />
    <path d="M 720,15 C 760,85 810,160 870,220" stroke="#00e5ff" stroke-width="2" fill="none" opacity="0.6" />
    <path d="M 770,10 C 810,75 860,140 920,195" stroke="#ffb300" stroke-width="2" fill="none" opacity="0.75" />
  </g>

  <!-- Left Content: Typography -->
  <!-- Forbes Brand Conference pill -->
  <g transform="translate(240, 28)">
    <text x="145" y="16" text-anchor="middle" fill="#ffffff" font-family="'Times New Roman', serif" font-weight="bold" font-size="20" letter-spacing="1">Forbes</text>
    <text x="175" y="10" fill="#999999" font-family="'Work Sans', sans-serif" font-size="8" font-weight="600" letter-spacing="1.5">VIETNAM</text>
    <circle cx="95" cy="32" r="2.5" fill="#f4121e" />
    <text x="145" y="35" text-anchor="middle" fill="#d0d0d0" font-family="'Work Sans', sans-serif" font-size="10" font-weight="700" letter-spacing="2">BRAND CONFERENCE</text>
    <circle cx="195" cy="32" r="2.5" fill="#f4121e" />
  </g>

  <!-- Big Title: BẢN SẮC hay QUY MÔ -->
  <g transform="translate(385, 125)">
    <text x="0" y="0" text-anchor="middle" fill="#ffffff" font-family="'Times New Roman', serif" font-style="italic" font-weight="normal" font-size="44" letter-spacing="1">BẢN</text>
    <text x="80" y="0" text-anchor="middle" fill="url(#glowRed)" font-family="'Times New Roman', serif" font-weight="bold" font-size="44" letter-spacing="1">SẮC</text>
  </g>
  <g transform="translate(385, 172)">
    <text x="-95" y="0" text-anchor="middle" fill="#d0d0d0" font-family="'Times New Roman', serif" font-style="italic" font-size="24">hay</text>
    <text x="20" y="0" text-anchor="middle" fill="#ffffff" font-family="'Work Sans', sans-serif" font-weight="900" font-size="42" letter-spacing="3">QUY MÔ</text>
  </g>

  <!-- Subtitle: MORE or CORE -->
  <g transform="translate(385, 198)">
    <text x="0" y="0" text-anchor="middle" fill="#ffffff" font-family="'Times New Roman', serif" font-weight="bold" font-size="14" letter-spacing="3">MORE <tspan font-style="italic" font-weight="normal" font-size="12" fill="#888888">or</tspan> CORE</text>
  </g>

  <!-- Date & Location -->
  <g transform="translate(385, 222)">
    <text x="0" y="0" text-anchor="middle" fill="#888888" font-family="'Work Sans', sans-serif" font-size="11" font-weight="600" letter-spacing="2">HCMC | 2026</text>
  </g>
</svg>
